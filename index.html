<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Gato aleatório</title>
    <style>
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
      }
      img {
        width: 400px;
        height: 400px;
        border-radius: 10px;
      }
      button {
        padding: 0.5rem 1rem;
        font-size: 16px;
        cursor: pointer;
      }
      .erro {
        color: red;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      function getCat() {
        const root = document.getElementById("root");

        root.innerHTML = `
          <div class="container">
            <img 
              src="https://cataas.com/cat?timestamp=${Date.now()}" 
              onerror="mostrarErro()" 
            />
            <div id="mensagem"></div>
            <button onclick="getCat()">Gerar outro gato</button>
          </div>
        `;
      }

      function mostrarErro() {
        const mensagem = document.getElementById("mensagem");
        mensagem.innerHTML = "Não conseguimos carregar o gatinho. Tente novamente.";
      }

      getCat();
    </script>
  </body>
</html>
